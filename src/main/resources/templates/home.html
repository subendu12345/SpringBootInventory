<!DOCTYPE html>
<html lang="en" xmlns="http://www.thymeleaf.org" th:replace="base::layout(~{::section})">

<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>

    <style>
        #page-overlay {
            position: fixed;
            /* Fixes the overlay to the viewport */
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.8);
            /* Semi-transparent white background */
            z-index: 9999;
            /* Ensures it's on top of other content */
            display: none;
            /* Hidden by default, show with JavaScript */
        }

        .purchase-add-new-button {
            color: #a86c2d;
            border: 1px solid #c98842;
            background: #fffaf0;
            font-weight: 700;
            transition: background-color .2s ease, color .2s ease, border-color .2s ease,
                box-shadow .2s ease;
        }

        .purchase-add-new-button:hover,
        .purchase-add-new-button:focus {
            color: #1b2028;
            border-color: #c98842;
            background: linear-gradient(135deg, #e2b66d, #c98842);
            box-shadow: 0 3px 8px rgba(201, 136, 66, .28);
        }
    </style>
</head>

<body>
    <section class="home-page">
        <div th:replace="/utill/MessageShow.html :: toast"></div>
        <div class="row">
            <div class="col-sm-12">
                <div class="home-actions">
                    <button type="button" class="btn btn-info" data-toggle="modal" data-target="#productModal">Add
                        Products</button>
                    <button type="button" class="btn purchase-add-new-button" data-toggle="modal"
                        data-target="#purchaseEntryFormModal">Add New Purchase</button>
                    <span class="badge badge-primary" id="totalBottoleCount"></span>
                    <span class="badge badge-success" id="totalStockAmount"></span>
                    <div class="home-status">
                        <span class="home-status-item">
                            <img class="home-user-icon" th:src="@{/img/user_icon.png}" alt="User">
                            <strong th:text="${loggedInUser}">User</strong>
                        </span>
                        <span class="home-status-divider"></span>
                        <span class="home-status-item">
                            <span class="home-status-label">Time</span>
                            <strong id="currentTime">--:--:--</strong>
                        </span>
                    </div>
                </div>
                <div th:replace="/product/ProductStock.html :: productStockDashBoard"></div>
            </div>
            <!-- <div th:if="${session.sessionObj.role == 'ADMIN'}" class="col-sm-6">
                <div class="shadow-box">
                    <div th:replace="/sale/NewSalesEntryForm.html :: saleEntryForm"></div>
                </div>
            </div> -->
        </div>

        <div class="modal fade" id="productModal" tabindex="-1" role="dialog" aria-labelledby="productModalLabel"
            aria-hidden="true">
            <div class="modal-dialog modal-xl" role="document">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="productModalLabel">Add Products</h5>
                        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                            <span aria-hidden="true">&times;</span>
                        </button>
                    </div>
                    <div class="modal-body">
                        <div th:replace="/product/productEntryForm.html :: productEntryForm"></div>
                    </div>
                </div>
            </div>
        </div>


        <div class="modal fade" id="purchaseEntryFormModal" tabindex="-1" role="dialog"
            aria-labelledby="purchaseEntryFormModal" aria-hidden="true">

            <div class="modal-dialog modal-xl" role="document">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="purchaseEntryFormModal">Add new Purchase</h5>
                        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                            <span aria-hidden="true">&times;</span>
                        </button>
                    </div>
                    <div class="modal-body">
                        <div th:replace="/purchase/PurchaseEntryForm.html :: purchaseEntryForm"></div>
                    </div>
                </div>
            </div>
        </div>


        <script>

            document.addEventListener('DOMContentLoaded', () => {
                const loadingSpinner = document.getElementById('loadingSpinner');
                if (loadingSpinner) {
                    loadingSpinner.classList.remove('d-none');
                }
                const currentTime = document.getElementById('currentTime');
                const updateClock = () => {
                    currentTime.textContent = new Intl.DateTimeFormat(undefined, {
                        hour: '2-digit',
                        minute: '2-digit',
                        second: '2-digit'
                    }).format(new Date());
                };
                updateClock();
                window.setInterval(updateClock, 1000);
                $('#purchaseEntryFormModal').on('show.bs.modal', () => {
                    if (window.resetPurchaseEntryForm) {
                        window.resetPurchaseEntryForm();
                    }
                });
                console.log('frm home page calling  ')
            })
        </script>
    </section>

    <!-- sendBackupBtn -->



</body>
