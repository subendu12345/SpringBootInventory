<!DOCTYPE html>

<html lang="en" xmlns="http://www.thymeleaf.org" th:fragment="layout(content)">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/jpeg" th:href="@{/img/das_fasion_logo.jpeg}">
    <title>Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", sans-serif;
        }

        body {
            position: relative;
            isolation: isolate;
            overflow: hidden;
            height: 100vh;
            min-height: 520px;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: #20232a;
        }

        body::before {
            position: absolute;
            z-index: -2;
            content: "";
            inset: -24px;
            background: url('/img/das_fasion_background.jpeg') center / cover no-repeat;
            filter: blur(3px);
            transform: scale(1.04);
        }

        body::after {
            position: absolute;
            z-index: -1;
            content: "";
            inset: 0;
            background: rgba(12, 17, 28, 0.58);
        }

        .login-container {
            background: rgba(18, 24, 35, 0.82);
            -webkit-backdrop-filter: blur(4px);
            backdrop-filter: blur(4px);
            padding: 40px 35px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            box-shadow: 0 18px 45px rgba(0, 0, 0, 0.35);
            width: min(350px, 100%);
            animation: fadeIn 1s ease-in-out;
        }

        .login-container > img {
            display: block;
            margin: 0 auto 18px;
            border: 2px solid rgba(255, 255, 255, 0.7);
        }

        .login-container h2 {
            text-align: center;
            margin-bottom: 25px;
            font-size: 26px;
            color: #fff;
        }

        .input-group {
            margin-bottom: 20px;
            position: relative;
        }

        .input-group label {
            display: block;
            margin-bottom: 6px;
            color: rgba(255, 255, 255, 0.82);
            font-size: 14px;
        }

        .input-group input {
            width: 100%;
            padding: 12px 15px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.28);
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            outline: none;
            transition: all 0.3s ease;
            font-size: 14px;
        }

        .input-group input:focus {
            border-color: #e2b66d;
            box-shadow: 0 0 0 3px rgba(226, 182, 109, 0.2);
        }

        .input-group input::placeholder {
            color: rgba(255, 255, 255, 0.55);
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #e2b66d, #c98842);
            color: #1b2028;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.2);
        }

        .extra-links {
            margin-top: 15px;
            text-align: center;
        }

        .extra-links a {
            text-decoration: none;
            font-size: 13px;
            color: #e2b66d;
            transition: color 0.3s ease;
        }

        .extra-links a:hover {
            color: #f2d29a;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>
    <div class="login-container">
        <img th:src="@{/img/das_fasion_logo.jpeg}" style="width: 69px; border-radius: 34px 34px;" />
        <h2>Login</h2>
        <form id="login-form" class="form"  method="post" th:action="@{/signin}">
            <div class="input-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Enter username" required autocomplete="off">
            </div>
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" name="password" autocomplete="off" id="password" placeholder="Enter password" required>
            </div>
            <button type="submit" class="login-btn">Login</button>
            <!-- <div class="extra-links">
                <a href="#">Forgot Password?</a> | <a href="#">Sign Up</a>
            </div> -->
        </form>
    </div>
</body>

</html>
