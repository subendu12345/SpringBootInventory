<!DOCTYPE html>
<html lang="en" xmlns="http://www.thymeleaf.org" th:replace="base::layout(~{::section})">

<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>Product Manager</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>

</head>

<section>
    <style>
        .barcode-print-label {
            width: 58mm;
            min-height: 24mm;
            margin: 0 auto 3px;
            padding: 2mm;
            overflow: hidden;
            background: #fff;
            color: #000;
            text-align: center;
        }

        .barcode-print-label svg {
            display: block;
            width: 100%;
            height: 15mm;
        }

        #barcodePrintModal,
        #barcodePreviewModal {
            z-index: 1070;
        }

        #barcodePrintModal .modal-content,
        #barcodePreviewModal .modal-content {
            border: 1px solid #e2b66d;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.35);
        }

        #barcodePreviewModal .modal-body {
            max-height: 65vh;
            overflow-y: auto;
            border-top: 1px solid rgba(226, 182, 109, 0.35);
            border-bottom: 1px solid rgba(226, 182, 109, 0.35);
        }

        #barcodePrintArea {
            position: absolute;
            left: -100000px;
            top: 0;
            width: 4in;
            overflow: hidden;
        }

        @media print {
            @page {
                size: 4in auto;
                margin: 0;
            }

            html,
            body {
                width: 4in !important;
                margin: 0 !important;
                padding: 0 !important;
                background: #fff !important;
            }

            body * {
                visibility: hidden !important;
            }

            #barcodePrintArea,
            #barcodePrintArea * {
                visibility: visible !important;
            }

            #barcodePrintArea {
                display: grid !important;
                grid-template-columns: 2in 2in !important;
                width: 4in !important;
                position: absolute !important;
                left: 0 !important;
                top: 0 !important;
                margin: 0 !important;
                padding: 0 !important;
                background: #fff !important;
                color: #000 !important;
                box-sizing: border-box !important;
            }

            .barcode-print-label {
                display: flex !important;
                flex-direction: column !important;
                align-items: center !important;
                justify-content: center !important;
                width: 2in !important;
                min-width: 2in !important;
                max-width: 2in !important;
                min-height: 30mm !important;
                box-sizing: border-box !important;
                margin: 0 !important;
                padding: 2mm !important;
                overflow: hidden !important;
                background: #fff !important;
                color: #000 !important;
                text-align: center !important;
                break-inside: avoid !important;
                page-break-inside: avoid !important;
            }

            .barcode-print-label .barcode-product-name {
                display: none !important;
            }

            .barcode-print-label .barcode-price {
                display: block !important;
                font-size: 10px !important;
                line-height: 1.2 !important;
                margin-top: 1mm !important;
            }

            .barcode-print-label svg {
                display: block !important;
                width: 100% !important;
                max-width: 100% !important;
                height: 18mm !important;
                margin: 0 auto !important;
            }

            #barcodePrintModal,
            #barcodePreviewModal,
            .modal-backdrop {
                display: none !important;
            }
        }
    </style>
    <div class="container">
        <div th:replace="/utill/MessageShow.html :: toast"></div>
        <!-- Message Box -->
        <div id="messageBox" class="message-box alert fade show d-none" role="alert"></div>
        <div class="page-heading-toolbar">
            <h2>Product Management</h2>
        </div>

        <table class="table table-bordered table-striped table-hover">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Volume/Qty.</th>
                    <th>Category</th>
                    <th>Sub-Category</th>
                    <th>Price</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="product : ${products}">
                    <td th:text="${product.id}">1</td>
                    <td th:text="${product.name}">Example Product</td>
                    <td th:text="${inventoryQuantities[product.id] ?: 0}">0</td>
                    <td th:text="${product.subCategory?.category?.name ?: 'Category Missing'}">Category</td>
                    <td th:text="${product.subCategory?.name ?: 'Category Missing add it'}">Sub-Category X</td>
                    <td th:text="${latestPrices[product.id] ?: 0}">0</td>
                    <td>
                        <!-- <a th:href="@{/products/view/{id}(id=${product.id})}" class="btn btn-info btn-sm">View</a> -->
                        <button type="button" class="btn btn-warning btn-sm product-edit-btn"
                            th:attr="data-id=${product.id}" data-bs-toggle="modal" data-bs-target="#productManagerEdit">
                            Edit
                        </button>

                        <button type="button" class="btn btn-info btn-sm ms-2"
                            th:attr="data-id=${product.id}, data-name=${product.name}" data-bs-toggle="modal"
                            data-bs-target="#priceBookModal">
                            Add/View Price Book
                        </button>

                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(products)}">
                    <td colspan="7" class="text-center">No products found.</td>
                </tr>
            </tbody>
        </table>


        <!-- Product Modal for Add/Edit -->
        <div class="modal fade" id="productManagerEdit" tabindex="-1" aria-labelledby="modalTitle" aria-hidden="false">
            <div class="modal-dialog modal-lg">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="modalTitle">Edit Product</h5>
                        <!-- <div class="text-right">
                        <label for="totalAmount" class="mb-0">Total Amount</label>
                        <input type="text" id="totalAmount" name="totalAmount" readonly
                            class="form-control form-control-sm text-right font-weight-bold" value="0.00">
                    </div> -->
                        <button type="button" onclick="productManagerEditClose()" class="close"
                            data-dismiss="purchaseModal" aria-label="Close">
                            <span aria-hidden="true">&times;</span>
                        </button>
                    </div>
                    <div class="modal-body">
                        <form id="productManagerEditForm">
                            <input type="hidden" id="productId" name="productId">

                            <div class="row">
                                <div class="col-md-6 form-group">
                                    <label for="productName">Product Name</label>
                                    <input type="text" id="productName" name="productName" class="form-control"
                                        required>
                                </div>
                                <!-- <div class="col-md-6 form-group">
                                    <label for="productVolume">Volume/Qty.</label>
                                    <input type="number" id="productVolume" name="productVolume" class="form-control"
                                        required>
                                </div> -->
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label for="category" class="form-label">Category</label>
                                        <select id="category" class="form-select" name="category.id" required>
                                            <option value="">Select a category</option>
                                            <!-- Thymeleaf can pre-populate all categories here from the controller -->
                                            <option th:each="cat : ${categories}" th:value="${cat.id}"
                                                th:text="${cat.name}"></option>
                                        </select>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label for="subCategory" class="form-label">Sub-Category</label>
                                        <select id="subCategory" class="form-select" name="subCategory.id" required>

                                            <!-- This will be dynamically populated by JavaScript -->
                                        </select>
                                    </div>
                                </div>
                                <!-- <div class="col-md-6 form-group">
                                <label for="supplierInfo">Category</label>
                                <input type="text" id="supplierInfo" name="supplierInfo"
                                    placeholder="Supplier Name or ID" class="form-control" required>
                            </div> -->
                            </div>
                            <!-- <div class="d-flex justify-content-between align-items-center mb-3">
                            <button type="button" id="addItemBtn" class="btn btn-info btn-sm">
                                <i class="fas fa-plus"></i> Add Item
                            </button>
                        </div> -->
                        </form>
                    </div>
                    <div class="modal-footer">
                        <button type="button" onclick="productManagerEditClose()" class="btn btn-secondary"
                            data-dismiss="modal">Close</button>
                        <button type="button" id="saveProductBtn" class="btn btn-primary">Update Product</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Price Book Modal -->
        <div class="modal fade" id="priceBookModal" tabindex="-1" aria-labelledby="priceBookModalLabel"
            aria-hidden="true">
            <div class="modal-dialog modal-lg">
                <div class="modal-content">
                    <form id="priceBookForm">
                        <div class="modal-header">
                            <h5 class="modal-title" id="priceBookModalLabel">Price Book Details</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <div class="modal-body">
                            <div class="row mb-4">
                                <div class="col-md-6">
                                    <label for="barcodeNumber" class="form-label">Barcode Number</label>
                                    <input type="text" class="form-control" id="barcodeNumber" readonly required>
                                </div>
                                <div class="col-md-6">
                                    <label for="productPrice" class="form-label">Product Price</label>
                                    <input class="form-control" id="productPrice" type="number" step="0.01" required>
                                </div>
                            </div>
                            <div class="d-flex justify-content-end mb-3">
                                <button type="button" class="btn btn-primary" id="savePriceBookBtn">Save Price
                                    Book</button>
                            </div>
                            <h6 id="priceBookTableTitle">Existing Price Books</h6>
                            <table class="table table-striped" id="priceBookTable">
                                <thead class="table-dark">
                                    <tr>
                                        <th>Barcode</th>
                                        <th>Price</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <!-- Price book details will be populated here -->
                                </tbody>
                            </table>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <div class="modal fade" id="barcodePrintModal" tabindex="-1" aria-labelledby="barcodePrintModalLabel"
            aria-hidden="true" data-bs-backdrop="false">
            <div class="modal-dialog modal-sm">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="barcodePrintModalLabel">Print Barcode</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body text-center">
                        <div id="printProductName" class="fw-bold mb-3"></div>
                        <label for="printBarcodeCount" class="form-label">Number of labels</label>
                        <input type="number" class="form-control mb-3" id="printBarcodeCount" min="1" step="1"
                            value="1" required>
                        <div class="border rounded p-3">
                            <div class="small text-muted">Barcode number</div>
                            <strong id="printBarcodeNumber" class="d-block fs-4"></strong>
                            <div class="small text-muted mt-2">Price: <span id="printProductPrice"></span></div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                        <button type="button" class="btn btn-primary" id="prepareBarcodePrintBtn">Continue</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="modal fade" id="barcodePreviewModal" tabindex="-1" aria-labelledby="barcodePreviewModalLabel"
            aria-hidden="true" data-bs-backdrop="false">
            <div class="modal-dialog modal-sm">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="barcodePreviewModalLabel">Barcode Preview</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body p-2">
                        <div id="barcodePrintLabels"></div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                        <button type="button" class="btn btn-primary" id="printBarcodeLabelsBtn">Print</button>
                    </div>
                </div>
            </div>
        </div>


        <!-- Dedicated print-only container for 58mm thermal printers.
             It stays empty on screen and is populated immediately before printing. -->
        <div id="barcodePrintArea" aria-hidden="true"></div>

        <div id="liveToast" class="toast align-items-center text-bg-primary border-0" role="alert" aria-live="assertive"
            aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body">
                    <p id="toatMessgeText"></p>
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"
                    aria-label="Close"></button>
            </div>
        </div>

    </div>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const productModal = document.getElementById('productManagerEdit');
            const form = document.getElementById('productManagerEditForm');
            const priceBookForm = document.getElementById('priceBookForm');
            const priceBookTableBody = document.getElementById('priceBookTable').querySelector('tbody');
            const priceBookModal_Data = document.getElementById('priceBookModal')
            const modalTitle = document.getElementById('modalTitle');
            const categorySelect = document.getElementById('category');
            const subCategorySelect = document.getElementById('subCategory');
            const savePriceBookBtn_L = document.getElementById('savePriceBookBtn');
            // Helper function to show a dismissible message box
            function showMessage(text, isError = false) {
                messageBox.textContent = text;
                messageBox.className = 'message-box alert fade show';
                messageBox.classList.add(isError ? 'alert-danger' : 'alert-success');
                messageBox.classList.remove('d-none');
                setTimeout(() => {
                    messageBox.classList.remove('show');
                    setTimeout(() => {
                        messageBox.classList.add('d-none');
                    }, 300);
                }, 3000);
            }

            // Function to fetch and populate sub-categories
            const populateSubCategories = (categoryId, selectedSubCategoryId = null) => {
                // Clear existing options
                subCategorySelect.innerHTML = '<option value="">Select a sub-category</option>';
                if (!categoryId) {
                    return Promise.resolve();
                }
                return fetch('/products/api/get/' + categoryId + '/subcategories')
                    .then(response => {
                        if (!response.ok) {
                            throw new Error('Network response was not ok');
                        }
                        return response.json();
                    })
                    .then(subCategories => {
                        if (subCategories && subCategories.subCategories) {
                            subCategories.subCategories.forEach(sub => {
                                const option = document.createElement('option');
                                option.value = sub.id;
                                option.textContent = sub.code + "-" + sub.name;
                                if (selectedSubCategoryId && String(sub.id) === String(selectedSubCategoryId)) {
                                    option.selected = true;
                                }
                                subCategorySelect.appendChild(option);
                            });
                        }

                    })
                    .catch(error => {
                        console.error('Error fetching sub-categories:', error);
                    });
            };

            // Event listener for Category dropdown change
            categorySelect.addEventListener('change', (event) => {
                const selectedCategoryId = event.target.value;
                populateSubCategories(selectedCategoryId);
            });


            // Function to close the modal
            window.productManagerEditClose = function () {
                const modal = bootstrap.Modal.getInstance(productModal);
                if (modal) {
                    modal.hide();
                }
            }


            // Listen for the modal to be shown (the correct Bootstrap event)
            productModal.addEventListener('show.bs.modal', function (event) {
                const button = event.relatedTarget;
                const productId = button.getAttribute('data-id');

                // Clear the form and set a new title for "Add" action
                form.reset();
                modalTitle.textContent = "Add New Product";

                if (productId) {
                    // It's an Edit action
                    modalTitle.textContent = "Edit Product";

                    // Fetch product data from the server using the new API endpoint
                    fetch(`/products/api/get/${productId}`)
                        .then(response => {
                            if (!response.ok) {
                                throw new Error('Network response was not ok');
                            }
                            return response.json();
                        })
                        .then(product => {
                            // Populate the form fields with the product data
                            document.getElementById('productId').value = product.id;
                            document.getElementById('productName').value = product.name;
                            // document.getElementById('productVolume').value = product.volumeMl;
                            categorySelect.value = product.categoryId != null ? product.categoryId : '';
                            populateSubCategories(product.categoryId, product.subCategoryId);
                        })
                        .catch(error => {
                            console.error('There was a problem fetching the product data:', error);
                            // You can display an error message here
                        });
                }
            });


            priceBookModal_Data.addEventListener('show.bs.modal', function (event) {
                const button = event.relatedTarget;
                const productId = button.getAttribute('data-id');
                const productName = button.getAttribute('data-name');
                priceBookModal_Data.dataset.productId = productId;
                priceBookModal_Data.dataset.productName = productName;
                priceBookForm.reset();
                priceBookTableBody.innerHTML = '';
                document.getElementById('priceBookModalLabel').innerHTML = `Price Books for <strong>${productName}</strong>`;

                fetch(`/products/api/pricebook/${productId}`)
                    .then(response => {
                        if (!response.ok) {
                            throw new Error('Network response was not ok');
                        }
                        return response.json();
                    })
                    .then(priceBooks => {
                        renderPriceBooks(productId, priceBooks);
                    })
                    .catch(error => {
                        console.error('There was a problem fetching the product data:', error);
                        // You can display an error message here
                    });

                generateBarcode().catch(error => {
                    document.getElementById('barcodeNumber').placeholder = 'Barcode generation failed';
                    console.error(error);
                });

            })

            function renderPriceBooks(productId, priceBooks) {
                priceBookTableBody.innerHTML = '';
                if (priceBooks.length === 0) {
                    priceBookTableBody.innerHTML = '<tr><td colspan="3" class="text-center">No price books found.</td></tr>';
                }
                priceBooks.forEach(pb => {
                    const row = document.createElement('tr');
                    row.dataset.id = pb.id;
                    row.innerHTML = `
                        <td class="editable-cell" data-field="barcode" contenteditable="true">${pb.productBarCode}</td>
                        <td class="editable-cell" data-field="price" contenteditable="true">${pb.productPrice.toFixed(2)}</td>
                        <td>
                            <button type="button" class="btn btn-danger btn-sm delete-pricebook-btn" disabled data-id="${pb.id}">Delete</button>
                            <button type="button" class="btn btn-secondary btn-sm print-pricebook-btn ms-1"
                                data-barcode="${pb.productBarCode}" data-price="${pb.productPrice.toFixed(2)}">
                                Print
                            </button>
                        </td>
                    `;
                    priceBookTableBody.appendChild(row);
                });
            }

            document.getElementById('priceBookTable').addEventListener('click', event => {
                const printButton = event.target.closest('.print-pricebook-btn');
                if (!printButton) return;

                document.getElementById('printBarcodeNumber').textContent = printButton.dataset.barcode;
                document.getElementById('printProductPrice').textContent = printButton.dataset.price;
                document.getElementById('printProductName').textContent = priceBookModal_Data.dataset.productName || '';
                document.getElementById('printBarcodeCount').value = 1;
                new bootstrap.Modal(document.getElementById('barcodePrintModal')).show();
            });

            document.getElementById('prepareBarcodePrintBtn').addEventListener('click', () => {
                const barcode = document.getElementById('printBarcodeNumber').textContent;
                const count = Number.parseInt(document.getElementById('printBarcodeCount').value, 10);
                if (!barcode || !Number.isInteger(count) || count < 1) return;

                const labels = document.getElementById('barcodePrintLabels');
                labels.innerHTML = '';

                const price = document.getElementById('printProductPrice').textContent.trim();

                for (let index = 0; index < count; index += 1) {
                    const label = document.createElement('div');
                    label.className = 'barcode-print-label';

                    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
                    svg.classList.add('barcode-svg');

                    const priceEl = document.createElement('div');
                    priceEl.className = 'barcode-price';
                    priceEl.textContent = price ? `Price: ${price}` : '';

                    label.appendChild(svg);
                    label.appendChild(priceEl);
                    labels.appendChild(label);

                    JsBarcode(svg, barcode, {
                        format: 'CODE128',
                        displayValue: true,
                        fontSize: 10,
                        fontOptions: 'bold',
                        height: 48,
                        width: 1.5,
                        margin: 4,
                        textMargin: 2,
                        flat: false
                    });
                }

                bootstrap.Modal.getInstance(document.getElementById('barcodePrintModal')).hide();
                new bootstrap.Modal(document.getElementById('barcodePreviewModal')).show();
            });

            document.getElementById('printBarcodeLabelsBtn').addEventListener('click', () => {
                const source = document.getElementById('barcodePrintLabels');
                const printArea = document.getElementById('barcodePrintArea');

                if (!source || !printArea || !source.children.length) {
                    console.error('No barcode labels available for printing.');
                    return;
                }

                // Clone the already-rendered SVG labels into a dedicated print-only area.
                // This avoids Bootstrap modal/backdrop CSS affecting the browser print preview.
                printArea.innerHTML = source.innerHTML;

                const previewModalEl = document.getElementById('barcodePreviewModal');
                const previewModal = bootstrap.Modal.getInstance(previewModalEl);

                if (previewModal) {
                    previewModal.hide();
                }

                // Wait for Bootstrap to finish removing the modal/backdrop, then print.
                const startPrint = () => {
                    requestAnimationFrame(() => {
                        requestAnimationFrame(() => {
                            window.print();
                        });
                    });
                };

                if (previewModalEl.classList.contains('show')) {
                    previewModalEl.addEventListener('hidden.bs.modal', startPrint, { once: true });
                } else {
                    startPrint();
                }
            });

            // Clear the print-only DOM after the browser finishes printing.
            window.addEventListener('afterprint', () => {
                const printArea = document.getElementById('barcodePrintArea');
                if (printArea) {
                    printArea.innerHTML = '';
                }

                // Re-open the preview after printing if the user is still on this workflow.
                const previewModalEl = document.getElementById('barcodePreviewModal');
                if (previewModalEl) {
                    const previewModal = bootstrap.Modal.getInstance(previewModalEl)
                        || new bootstrap.Modal(previewModalEl);
                    previewModal.show();
                }
            });

            function refreshPriceBooks(productId) {
                return fetch(`/products/api/pricebook/${productId}`)
                    .then(response => {
                        if (!response.ok) {
                            throw new Error('Unable to reload price books');
                        }
                        return response.json();
                    })
                    .then(priceBooks => renderPriceBooks(productId, priceBooks));
            }

            function generateBarcode() {
                const barcodeInput = document.getElementById('barcodeNumber');
                barcodeInput.value = '';
                barcodeInput.placeholder = 'Generating barcode...';
                savePriceBookBtn_L.disabled = true;

                return fetch('/products/api/pricebook/barcode')
                    .then(response => {
                        if (!response.ok) {
                            throw new Error('Unable to generate a unique barcode');
                        }
                        return response.text();
                    })
                    .then(barcode => {
                        barcodeInput.value = barcode;
                        barcodeInput.placeholder = '';
                        savePriceBookBtn_L.disabled = false;
                    });
            }

            savePriceBookBtn_L.addEventListener('click', (event) => {

                const PriceBookDTO = {
                    id: null,
                    productBarCode: document.getElementById('barcodeNumber').value,
                    productPrice: document.getElementById('productPrice').value,
                    productId: priceBookModal_Data.dataset.productId,
                }
                if (!PriceBookDTO.productPrice || !PriceBookDTO.productBarCode || !PriceBookDTO.productId) return;
                savePriceBookBtn_L.disabled = true;
                fetch("/products/api/save/pricebook", {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(PriceBookDTO)
                }).then(res => {
                    return res.json();

                }).then(res => {
                    if (res && res.message == 'success') {

                        showToast('Success', 'Price Book successfully save!', 'success');
                        document.getElementById('productPrice').value = '';
                        refreshPriceBooks(PriceBookDTO.productId)
                            .then(() => generateBarcode())
                            .catch(error => {
                                savePriceBookBtn_L.disabled = false;
                                console.error(error);
                            });
                    } else {
                        savePriceBookBtn_L.disabled = false;
                        showToast('Error save Pricebook', JSON.stringify(res.message), 'error')

                    }
                })
                    .catch(err => {
                        savePriceBookBtn_L.disabled = false;
                        showToast('Error save Pricebook', JSON.stringify(err), 'error')
                    })

            })


            document.getElementById('saveProductBtn').addEventListener('click', async () => {
                // Get a reference to the select element by its ID
                const subCategorySelect = document.getElementById('subCategory');
                const id = document.getElementById('productId').value;
                // Get the value of the currently selected option
                const subCategoryId = subCategorySelect.value;
                const categoryId = categorySelect.value;
                const name = document.getElementById('productName').value;
                // const volumeMl = document.getElementById('productVolume').value;
                // You can now use the value, for example, to log it to the console

                const productDTO = {
                    name,
                    categoryId,
                    subCategoryId,
                    // volumeMl,
                    id
                };
                try {
                    const response = await fetch(`/products/api/update/${id}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(productDTO)
                    });

                    if (!response.ok) {
                        const errorData = await response.json();
                        throw new Error(errorData.message || 'Failed to save purchase.');
                    }

                    showToast('Success!', 'Product successfully saved!', 'success');
                    window.location.reload();
                } catch (error) {
                    console.error('Error saving purchase:', error);
                    showToast('Error', error.message, 'error');
                } finally {

                }
            });


            function showToast(title, message, type = "primary") {
                // Get toast elements
                const toastEl = document.getElementById("basicToast");
                const toastTitle = document.getElementById("myToastTitle");
                const toastMessage = document.getElementById("myToastMessage");
                const header = toastEl.querySelector(".toast-header");

                // Set values
                toastTitle.textContent = title;
                toastMessage.textContent = message;

                // Update color (Bootstrap contextual classes)
                header.className = `toast-header bg-${type} text-light`;

                // Show toast
                const toast = new bootstrap.Toast(toastEl);
                toast.show();
            }
        })
    </script>
