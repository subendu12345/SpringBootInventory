<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="base::layout(~{::section})">
<section>
    <div id="messageBox" class="message-box alert fade show d-none" role="alert"></div>
    <div class="container-fluid">
        <div class="row">
            <main role="main" class="w-100 px-4">
                <div class="page-heading-toolbar">
                    <h1>Purchase History</h1>
                    <button type="button" class="btn btn-primary" data-toggle="modal"
                        data-target="#purchaseEntryFormModal">
                        <i class="fas fa-plus mr-1"></i>Add New Purchase
                    </button>
                </div>
                <table class="table table-bordered table-striped table-hover">
                    <thead class="thead-dark">
                        <tr>
                            <th>Sl. No</th>
                            <th>Products</th>
                            <th>Date</th>
                            <th>Supplier</th>
                            <th>Total Amount</th>
                            <th class="text-center">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="purchaseTableBody">
                        <tr>
                            <td colspan="6" class="text-center">Loading purchases...</td>
                        </tr>
                    </tbody>
                </table>
            </main>
        </div>
    </div>

    <div class="modal fade" id="purchaseEntryFormModal" tabindex="-1" role="dialog"
        aria-labelledby="purchaseEntryFormModal" aria-hidden="true">
        <div class="modal-dialog modal-xl" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="purchaseEntryFormModal">Add new Purchase</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span
                            aria-hidden="true">&times;</span></button>
                </div>
                <div class="modal-body">
                    <div th:replace="/purchase/PurchaseEntryForm.html :: purchaseEntryForm"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const purchaseTableBody = document.getElementById('purchaseTableBody');
            const messageBox = document.getElementById('messageBox');

            function formatDisplayDate(value) {
                const parts = String(value || '').substring(0, 10).split('-');
                return parts.length === 3 ? `${parts[2]}-${parts[1]}-${parts[0]}` : '';
            }

            function showMessage(text, isError = false) {
                messageBox.textContent = text;
                messageBox.className = `message-box alert fade show ${isError ? 'alert-danger' : 'alert-success'}`;
                window.setTimeout(() => messageBox.classList.add('d-none'), 3000);
            }

            function renderPurchases(purchases) {
                if (!purchases.length) {
                    purchaseTableBody.innerHTML = '<tr><td colspan="6" class="text-center text-muted">No purchases found.</td></tr>';
                    return;
                }
                purchaseTableBody.innerHTML = purchases.map(purchase => `<tr>
                    <td>${purchase.id}</td>
                    <td>${purchase.productsInfo || '<span class="text-danger">Purchase items missing</span>'}</td>
                    <td>${formatDisplayDate(purchase.dateOfPurchase)}</td>
                    <td>${purchase.supplierInfo || ''}</td>
                    <td>${Number(purchase.totalAmount || 0).toFixed(2)}</td>
                    <td class="text-center"><button class="deleteBtn btn btn-danger btn-sm" data-id="${purchase.id}"><i class="fas fa-trash"></i> Delete</button></td>
                </tr>`).join('');
                purchaseTableBody.querySelectorAll('.deleteBtn').forEach(button => {
                    button.addEventListener('click', () => deletePurchase(button.dataset.id));
                });
            }

            async function fetchPurchases() {
                try {
                    const response = await fetch('/api/purchases');
                    if (!response.ok) throw new Error('Failed to fetch purchases.');
                    renderPurchases(await response.json());
                } catch (error) {
                    purchaseTableBody.innerHTML = '<tr><td colspan="6" class="text-center text-danger">Failed to load purchases.</td></tr>';
                    showMessage(error.message, true);
                }
            }

            async function deletePurchase(id) {
                if (!window.confirm('Are you sure you want to delete this purchase?')) return;
                try {
                    const response = await fetch(`/api/purchase/delete/${id}`, { method: 'DELETE' });
                    if (!response.ok) throw new Error('Failed to delete purchase.');
                    await fetchPurchases();
                    showMessage('Purchase deleted successfully!');
                } catch (error) {
                    showMessage(error.message, true);
                }
            }

            $('#purchaseEntryFormModal').on('show.bs.modal', () => {
                if (window.resetPurchaseEntryForm) window.resetPurchaseEntryForm();
            });
            fetchPurchases();
        });
    </script>
</section>

</html>
